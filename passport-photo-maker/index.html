<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Size Photo Maker Online Free | FormTools</title><meta name="description" content="Make passport and ID photos online with country presets, DPI, MM/CM/PX sizes, crop, background, exact KB, name/date and print copies."><link rel="canonical" href="https://formtools.in/passport-photo-maker/"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/production.css"><link rel="stylesheet" href="/assets/seo-content.css"><style>
:root{--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#dbe3ef;--soft:#f8fafc}.ft{max-width:1180px;margin:auto;padding:0 14px}.tool{max-width:980px;margin:18px auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px #0f172a0b}.upload{padding:28px;text-align:center;border:2px dashed #a9b7ca;background:var(--soft);cursor:pointer}.upload.drag{border-color:var(--blue);background:#eff6ff}.editor{padding:18px}.preview{position:relative;background:#e8edf4;border-radius:16px;min-height:470px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview canvas{max-width:100%;max-height:560px;display:block;box-shadow:0 8px 25px #0002}.empty{color:var(--muted);text-align:center}.badge{position:absolute;top:10px;left:10px;background:#0f172acc;color:#fff;border-radius:20px;padding:5px 10px;font-size:12px;z-index:5}.grid{display:grid;grid-template-columns:minmax(320px,1fr) 380px;gap:20px}.controls{padding:4px}.step{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.step h3{font-size:15px;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.field input,.field select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.preset{display:flex;gap:8px}.preset select{flex:1}.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:9px;cursor:pointer}.chip.active{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}.bg{display:flex;flex-wrap:wrap;gap:7px}.bg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer}.bg button.active{outline:2px solid var(--blue)}.spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pill{font-size:12px;background:#eef2ff;padding:6px 9px;border-radius:20px}.cropbar{display:none;margin-top:10px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}.cropbar.on{display:block}.range{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.btn.alt{background:#eef2f7;color:#172033}.status{min-height:22px;color:var(--muted);font-size:13px;margin-top:8px}.advanced summary{font-weight:800;cursor:pointer}.result{margin-top:16px;padding:18px}.resultGrid{display:grid;grid-template-columns:240px 1fr;gap:18px}.result img{width:100%;background:#eef2f7;border-radius:12px}.copies{display:flex;gap:6px;flex-wrap:wrap}.sheet canvas{max-width:100%;height:auto}.hidden{display:none!important}.side{margin-top:18px}@media(max-width:850px){.grid{grid-template-columns:1fr}.preview{min-height:360px}.resultGrid{grid-template-columns:1fr}.range{grid-template-columns:1fr}}@media(max-width:520px){.editor{padding:10px}.preview{min-height:300px}.row{grid-template-columns:1fr}.upload{padding:22px 12px}}
</style></head><body data-formtools-build="V38-FINAL-PASSPORT"><main class="ft"><div class="tool"><div class="card" style="padding:18px"><div id="upload" class="upload"><strong>Upload your photo</strong><div style="margin-top:6px;color:var(--muted)">Drag & drop or click to choose JPG, PNG or WebP</div><input id="file" type="file" accept="image/*" hidden></div><div id="status" class="status"></div></div>
<div id="app" class="card editor hidden"><div class="grid"><section><div id="preview" class="preview"><span class="badge">Live preview</span><div id="empty" class="empty">Your photo will appear here</div><canvas id="canvas" class="hidden"></canvas><div id="cropFrame" class="hidden" style="position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px #0007;touch-action:none"><i></i><i></i><i></i><i></i></div></div><div id="spec" class="spec"></div><div id="cropbar" class="cropbar"><div class="range"><div class="field"><label>Zoom</label><input id="zoom" type="range" min="1" max="2.5" step=".01" value="1"></div><div class="field"><label>Horizontal</label><input id="px" type="range" min="0" max="100" value="50"></div><div class="field"><label>Vertical</label><input id="py" type="range" min="0" max="100" value="50"></div></div><div class="actions" style="margin-top:9px"><button class="btn alt" id="cropDone">Done crop</button><button class="btn alt" id="cropReset">Reset</button></div></div></section>
<section class="controls"><div class="step"><h3>1. Size</h3><div class="field"><label>Country / common requirement</label><select id="preset"></select></div><div class="row" style="margin-top:9px"><div class="field"><label>Unit</label><select id="unit"><option value="mm">MM</option><option value="cm">CM</option><option value="in">Inch</option><option value="px">PX</option></select></div><div class="field"><label>DPI</label><select id="dpi"><option>72</option><option>96</option><option>150</option><option>200</option><option selected>300</option><option>600</option></select></div></div><div class="row" style="margin-top:9px"><div class="field"><label>Width</label><input id="w" type="number" min="1" step=".01"></div><div class="field"><label>Height</label><input id="h" type="number" min="1" step=".01"></div></div><div class="field" style="margin-top:9px"><label>File size</label><select id="kb"><option value="0">No target</option><option>20</option><option>30</option><option>40</option><option selected>50</option><option>70</option><option>100</option><option>150</option><option>200</option><option>300</option><option value="custom">Custom KB</option></select></div><div id="customKBWrap" class="field hidden" style="margin-top:9px"><label>Custom KB</label><input id="customKB" type="number" min="1" max="5000" value="50"></div><div class="field" style="margin-top:9px"><label>Output format</label><select id="format"><option value="jpg">JPG</option><option value="png">PNG</option></select></div><div class="quick" id="quickKB"></div></div>
<div class="step"><h3>2. Crop</h3><div class="actions"><button class="btn alt" id="editCrop">Crop photo</button><span class="muted" id="cropInfo">Fit your photo to the selected ratio.</span></div></div>
<div class="step"><h3>3. Background</h3><div class="bg"><button data-bg="original" class="active">Original</button><button data-bg="white">White</button><button data-bg="offwhite">Off-white</button><button data-bg="blue">Blue</button><button data-bg="red">Red</button><button id="aiBg">Remove with AI</button></div><div id="aiMode" class="field hidden" style="margin-top:9px"><label>AI mode</label><select id="aiQuality"><option value="fast">Fast</option><option value="hq">High quality (slower)</option></select></div></div>
<div class="step"><h3>Optional details</h3><div class="row"><div class="field"><label>Name / Date / ID</label><input id="overlay" placeholder="e.g. Bijay 23/08/2026"></div><div class="field"><label>Text position</label><select id="overlayPos"><option value="bottom">Bottom</option><option value="top">Top</option></select></div></div></div>
<div class="step advanced"><details><summary>Advanced adjustments</summary><div class="range" style="margin-top:12px"><div class="field"><label>Brightness</label><input id="brightness" type="range" min="50" max="150" value="100"></div><div class="field"><label>Contrast</label><input id="contrast" type="range" min="50" max="150" value="100"></div><div class="field"><label>Saturation</label><input id="saturation" type="range" min="0" max="200" value="100"></div></div></details></div>
<div class="actions"><button class="btn" id="create">Create final photo</button></div></section></div>
<div id="result" class="result hidden"><div class="resultGrid"><div><img id="final" alt="Final passport photo"></div><div><h2 style="margin-top:0">Your photo is ready</h2><div id="finalSpec" class="spec"></div><div class="actions" style="margin-top:10px"><a id="download" class="btn" download>Download single photo</a></div><h3>Print copies</h3><div id="copies" class="copies"></div><div class="row" style="margin-top:10px"><div class="field"><label>Paper</label><select id="paper"><option value="a4">A4</option><option value="a5">A5</option><option value="letter">Letter</option></select></div><div class="field"><label>Custom copies</label><input id="customCopies" type="number" min="1" max="60" value="12"></div></div><div id="sheet" class="sheet" style="margin-top:12px"></div><div id="sheetDownload" class="actions" style="margin-top:9px"></div></div></div></div></div></div></main>
<script src="/assets/passport-v38.js?v=38" defer></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compress Image Between 50KB to 100KB Online | FormTools</title><meta name="description" content="Reduce an image into the 50KB to 100KB size range online."><link rel="canonical" href="https://formtools.in/compress-image-50kb-to-100kb/"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/production.css"><link rel="stylesheet" href="/assets/seo-content.css"></head><body><main><section class="container"><h1>Compress Image Between 50KB to 100KB</h1><p>Choose a target within the required KB range.</p><input id="file" type="file" accept="image/*"><input id="target" type="number" value="100"> <button id="go" class="btn" data-target="100">Compress</button><div id="out" class="result"></div><h2>How it works</h2><ol><li>Upload the image.</li><li>Choose a target between 50 and 100 KB.</li><li>Compress and verify the final size.</li></ol><h2>Other ranges</h2><div class="ft-related"><a href="/compress-image-10kb-to-20kb/">10KB to 20KB</a><a href="/compress-image-20kb-to-50kb/">20KB to 50KB</a><a href="/compress-image-100kb-to-200kb/">100KB to 200KB</a></div></section></main><script>const file=document.querySelector('#file'),go=document.querySelector('#go'),out=document.querySelector('#out');
file.onchange=()=>{};
go.onclick=async()=>{const f=file.files[0];if(!f)return alert('Choose an image first.');const target=+go.dataset.target*1024;const im=new Image();im.src=URL.createObjectURL(f);await im.decode();const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);let q=.92,b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));for(let i=0;i<18&&b.size>target;i++){q=Math.max(.05,q*.82);b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));}out.textContent='Result: '+c.width+'×'+c.height+'px · '+(b.size/1024).toFixed(1)+' KB';const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='compressed-image.jpg';a.click();};</script><script>document.querySelector('#target').oninput=e=>document.querySelector('#go').dataset.target=e.target.value</script>
<style>
.ft-smart-panel{margin:16px 0;padding:16px;border:1px solid #e5e7eb;border-radius:16px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.ft-spec-title{font-weight:700;margin-bottom:10px}.ft-spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}.ft-spec-grid span{color:#64748b}.ft-spec-grid b{text-align:right}
@media(max-width:700px){.ft-smart-panel{padding:12px;border-radius:12px}.ft-spec-grid{font-size:13px}}
</style>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function text(v){return v==null?"":String(v);}
function ensure(id,html,after){
  if(document.getElementById(id)) return document.getElementById(id);
  const n=document.createElement("section"); n.id=id; n.className="ft-smart-panel"; n.innerHTML=html;
  (after?after.parentElement:document.querySelector("main")||document.body).appendChild(n); return n;
}
function sync(){
  const kb=$("#targetKB")||$("#target-kb")||$('input[name*="kb" i]');
  const dpi=$("#dpi")||$('select[name*="dpi" i]')||$('input[name*="dpi" i]');
  const unit=$("#unit")||$('select[name*="unit" i]');
  const w=$("#width")||$('input[name*="width" i]');
  const h=$("#height")||$('input[name*="height" i]');
  const btn=$("[data-compress]")||$(".compress-btn")||$('button[id*="compress" i]');
  if(btn&&kb){btn.textContent="Compress to "+(kb.value||kb.textContent||"Target")+" KB";}
  const spec=$("#ft-live-spec")||ensure("ft-live-spec",
    '<div class="ft-spec-title">Live Photo Specifications</div><div class="ft-spec-grid"><span>Width</span><b data-s="w">—</b><span>Height</span><b data-s="h">—</b><span>Unit</span><b data-s="unit">—</b><span>DPI</span><b data-s="dpi">—</b><span>Target</span><b data-s="kb">—</b></div>');
  if(spec){
    $('[data-s="w"]',spec).textContent=w?.value||"—";
    $('[data-s="h"]',spec).textContent=h?.value||"—";
    $('[data-s="unit"]',spec).textContent=unit?.value||"—";
    $('[data-s="dpi"]',spec).textContent=dpi?.value||"—";
    $('[data-s="kb"]',spec).textContent=kb?.value?kb.value+" KB":"—";
  }
}
document.addEventListener("input",sync); document.addEventListener("change",sync); window.addEventListener("load",sync); sync();
})();
</script>
</body></html>

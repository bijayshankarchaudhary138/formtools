<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compress Image Between 20KB to 50KB Online | FormTools</title><meta name="description" content="Reduce an image into the 20KB to 50KB size range online."><link rel="canonical" href="https://formtools.in/compress-image-20kb-to-50kb/"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/production.css"><link rel="stylesheet" href="/assets/seo-content.css"></head><body><main><section class="container"><h1>Compress Image Between 20KB to 50KB</h1><p>Choose a target within the required KB range.</p><input id="file" type="file" accept="image/*"><input id="target" type="number" value="50"> <button id="go" class="btn" data-target="50">Compress</button><div id="out" class="result"></div><h2>How it works</h2><ol><li>Upload the image.</li><li>Choose a target between 20 and 50 KB.</li><li>Compress and verify the final size.</li></ol><h2>Other ranges</h2><div class="ft-related"><a href="/compress-image-10kb-to-20kb/">10KB to 20KB</a><a href="/compress-image-50kb-to-100kb/">50KB to 100KB</a><a href="/compress-image-100kb-to-200kb/">100KB to 200KB</a></div></section></main><script>const file=document.querySelector('#file'),go=document.querySelector('#go'),out=document.querySelector('#out');
file.onchange=()=>{};
go.onclick=async()=>{const f=file.files[0];if(!f)return alert('Choose an image first.');const target=+go.dataset.target*1024;const im=new Image();im.src=URL.createObjectURL(f);await im.decode();const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);let q=.92,b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));for(let i=0;i<18&&b.size>target;i++){q=Math.max(.05,q*.82);b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));}out.textContent='Result: '+c.width+'×'+c.height+'px · '+(b.size/1024).toFixed(1)+' KB';const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='compressed-image.jpg';a.click();};</script><script>document.querySelector('#target').oninput=e=>document.querySelector('#go').dataset.target=e.target.value</script></body></html>
